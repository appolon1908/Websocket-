name: WebSocket conflict source inspection
on:
  push:
    branches: [repair/websocket-prs-2-6-20260907]
    paths: [.github/workflows/pr-conflict-source-export.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e195d115ec8c7523ae022aa491e0fc52f678d5a
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned history and inspect both merges without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 5e195d115ec8c7523ae022aa491e0fc52f678d5a
          out="$RUNNER_TEMP/websocket-pr-sources"
          mkdir -p "$out"
          git branch source-main 5e195d115ec8c7523ae022aa491e0fc52f678d5a
          git branch source-pr2 3a29631f2d251be45f9b6a8069d4f2f1162dffed
          git branch source-pr6 e65ca204559f6cbe2f954ceef28825b61db18c12
          git bundle create "$out/source.bundle" source-main source-pr2 source-pr6
          git config user.name 'Source inspection'
          git config user.email 'source-inspection@users.noreply.github.com'
          for pr in 2 6; do
            git checkout --detach "source-pr$pr"
            set +e
            git -c core.hooksPath=/dev/null merge --no-commit --no-ff source-main > "$out/pr$pr-merge.txt" 2>&1
            result=$?
            set -e
            cat "$out/pr$pr-merge.txt"
            test "$result" -le 1
            git diff --name-only --diff-filter=U > "$out/pr$pr-conflicts.txt"
            git diff --cc > "$out/pr$pr-conflicts.diff"
            git merge --abort
          done
          printf '%s\n' 'REMOTE_REFS_CHANGED=NO' 'RUNTIME_CHANGED=NO' 'EXTERNAL_DELIVERY=NO'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: websocket-conflict-source-${{ github.sha }}
          path: ${{ runner.temp }}/websocket-pr-sources/
          if-no-files-found: error
          retention-days: 7
