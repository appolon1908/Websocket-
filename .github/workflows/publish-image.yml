name: Publish immutable WebSocket gateway image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

concurrency:
  group: websocket-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: appolon1908-hue/websocket-gateway

jobs:
  build-publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test, and publish exact source
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Emit immutable release coordinates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p image-evidence
          cat >image-evidence/published-image.txt <<EOF
          SOURCE_SHA=${GITHUB_SHA}
          IMAGE=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}
          MUTABLE_TAG_AUTHORITY=false
          EOF
          cat image-evidence/published-image.txt

      - name: Sign and publish build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: websocket-image-${{ github.sha }}
          path: image-evidence/published-image.txt
          if-no-files-found: error
          retention-days: 90
